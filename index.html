<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --primary: #D946EF;
      --primary-hover: #C026D3;
      --primary-dark: #86198F;
      --accent: #F43F5E;
      --bg-page: #FFF1F5;
      --card-bg: #FFF7FA;
      --card-highlight: #FFEBF3;
      --border-color: #FBCFE8;
      --text-main: #3B0764;
      --text-muted: #701A75;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: linear-gradient(180deg, #FFE4E6 0%, #FFF1F5 30%, #FDF2F8 100%);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Navigation */
    header {
      background: rgba(255, 241, 245, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 12px rgba(217, 70, 239, 0.25);
      border: 2px solid #FFFFFF;
    }

    .brand-text {
      font-family: 'Outfit', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .brand-text sub {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .brand-text span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .btn {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.25s ease;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #EC4899 0%, #D946EF 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 15px rgba(217, 70, 239, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(217, 70, 239, 0.45);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid var(--primary);
      color: var(--primary-dark);
    }

    .btn-outline:hover {
      background: #FFE4E6;
    }

    .hero {
      padding: 70px 0 50px;
      text-align: center;
    }
